name: Build POT System IMG

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build-img:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y debootstrap qemu-utils parted dosfstools e2fsprogs grub-efi-amd64-bin grub-pc-bin rsync curl wget openssl

      - name: Create and partition disk image
        run: |
          sudo qemu-img create -f raw /tmp/pot.img 4G
          sudo parted -s /tmp/pot.img mklabel gpt mkpart ESP fat32 1MiB 512MiB set 1 esp on mkpart primary ext4 512MiB 100%
          LOOP=$(sudo losetup -f --show -P /tmp/pot.img)
          echo $LOOP > /tmp/loop_device
          sudo mkfs.fat -F32 -n EFI ${LOOP}p1
          sudo mkfs.ext4 -L POT-ROOT ${LOOP}p2
          sudo mkdir -p /mnt/root /mnt/root/boot/efi
          sudo mount ${LOOP}p2 /mnt/root
          sudo mount ${LOOP}p1 /mnt/root/boot/efi
          echo "Loop device: $LOOP"

      - name: Bootstrap Debian
        run: |
          sudo debootstrap --arch=amd64 --variant=minbase \
            --include=systemd,systemd-sysv,dbus,udev,locales,ca-certificates,apt-utils \
            bookworm /mnt/root http://deb.debian.org/debian

      - name: Configure APT sources
        run: |
          echo "deb http://deb.debian.org/debian bookworm main contrib non-free non-free-firmware" | sudo tee /mnt/root/etc/apt/sources.list

      - name: Mount chroot filesystems
        run: |
          sudo mount --bind /proc /mnt/root/proc
          sudo mount --bind /sys /mnt/root/sys
          sudo mount --bind /dev /mnt/root/dev
          sudo mount --bind /dev/pts /mnt/root/dev/pts

      - name: Install packages
        run: |
          sudo chroot /mnt/root /bin/bash -c "
            export DEBIAN_FRONTEND=noninteractive
            apt-get update -qq
            apt-get install -y --no-install-recommends \
              linux-image-amd64 grub-efi-amd64 efibootmgr \
              iproute2 iptables nftables net-tools ethtool bridge-utils \
              ppp pppoe dnsmasq chrony \
              nginx php8.2-fpm php8.2-cli php8.2-sqlite3 php8.2-mbstring sqlite3 \
              openssh-server curl wget sudo nano bash-completion \
              usbutils pciutils tcpdump htop fail2ban frr \
              wireguard wireguard-tools openvpn openssl \
              firmware-linux firmware-linux-nonfree firmware-realtek firmware-atheros \
              2>&1 | tail -5
          "

      - name: Copy POT System files
        run: |
          sudo mkdir -p /mnt/root/opt/pot-system/webui /mnt/root/opt/pot-system/api
          sudo mkdir -p /mnt/root/opt/pot-system/scripts /mnt/root/opt/pot-system/services
          sudo mkdir -p /mnt/root/var/lib/pot-system /mnt/root/etc/pot-system/ssl
          sudo cp -r pot-system/webui/* /mnt/root/opt/pot-system/webui/ 2>/dev/null || true
          sudo cp -r pot-system/api/* /mnt/root/opt/pot-system/api/ 2>/dev/null || true
          sudo cp -r pot-system/scripts/* /mnt/root/opt/pot-system/scripts/ 2>/dev/null || true
          sudo cp -r services/* /mnt/root/opt/pot-system/services/ 2>/dev/null || true
          sudo find /mnt/root/opt/pot-system -name "*.sh" -exec chmod +x {} \;

      - name: Configure system
        run: |
          echo "pot-router" | sudo tee /mnt/root/etc/hostname
          printf "127.0.0.1 localhost\n127.0.1.1 pot-router\n" | sudo tee /mnt/root/etc/hosts

          # Auto-login root on tty1
          sudo mkdir -p /mnt/root/etc/systemd/system/getty@tty1.service.d
          printf "[Service]\nExecStart=\nExecStart=-/sbin/agetty --autologin root --noclear %%I \$TERM\n" | sudo tee /mnt/root/etc/systemd/system/getty@tty1.service.d/autologin.conf

          # Passwords
          sudo chroot /mnt/root /bin/bash -c "echo 'root:admin' | chpasswd"
          sudo chroot /mnt/root /bin/bash -c "useradd -m -s /bin/bash -G sudo admin 2>/dev/null || true; echo 'admin:admin' | chpasswd"

          # sysctl
          printf "net.ipv4.ip_forward=1\nnet.ipv6.conf.all.forwarding=1\n" | sudo tee /mnt/root/etc/sysctl.d/99-pot.conf

          # Network interfaces base
          printf "auto lo\niface lo inet loopback\n" | sudo tee /mnt/root/etc/network/interfaces

          # MOTD
          printf "\n╔══════════════════════════════════════╗\n║        POT System v1.0.0             ║\n║  Web UI: https://192.168.10.1        ║\n║  Login:  admin / admin               ║\n╚══════════════════════════════════════╝\n\n" | sudo tee /mnt/root/etc/motd

      - name: Create POT System startup service
        run: |
          sudo tee /mnt/root/opt/pot-system/services/startup.sh > /dev/null << 'STARTUP'
          #!/bin/bash
          LOG="/var/log/pot-system.log"
          exec >> "$LOG" 2>&1
          echo "=== POT System Boot $(date) ==="

          # Detect interfaces
          IFACES=($(ip link show | grep -E '^[0-9]+: (eth|en|usb)' | awk -F': ' '{print $2}' | tr -d '@'))
          WAN="${IFACES[0]:-eth0}"
          LAN="${IFACES[1]:-eth1}"
          echo "WAN=$WAN LAN=$LAN"

          # WAN - DHCP
          ip link set "$WAN" up
          dhclient "$WAN" &

          # LAN - static
          ip addr flush dev "$LAN" 2>/dev/null || true
          ip addr add 192.168.10.1/24 dev "$LAN"
          ip link set "$LAN" up

          # IP forwarding
          echo 1 > /proc/sys/net/ipv4/ip_forward

          # NAT
          iptables -t nat -F POSTROUTING 2>/dev/null || true
          iptables -t nat -A POSTROUTING -o "$WAN" -j MASQUERADE
          iptables -A FORWARD -i "$LAN" -o "$WAN" -j ACCEPT 2>/dev/null || true
          iptables -A FORWARD -m state --state ESTABLISHED,RELATED -j ACCEPT 2>/dev/null || true

          # DHCP for LAN
          cat > /etc/dnsmasq.d/pot-lan.conf << DNSMASQ
          interface=$LAN
          bind-interfaces
          dhcp-range=192.168.10.100,192.168.10.254,24h
          dhcp-option=3,192.168.10.1
          dhcp-option=6,192.168.10.1
          server=1.1.1.1
          server=8.8.8.8
          DNSMASQ
          systemctl restart dnsmasq 2>/dev/null || dnsmasq &

          # SSL cert
          mkdir -p /etc/pot-system/ssl
          if [ ! -f /etc/pot-system/ssl/pot.crt ]; then
            openssl req -x509 -nodes -days 3650 -newkey rsa:2048 \
              -keyout /etc/pot-system/ssl/pot.key \
              -out /etc/pot-system/ssl/pot.crt \
              -subj "/C=PH/O=POT System/CN=pot-router" 2>/dev/null
          fi

          # Nginx config
          cat > /etc/nginx/sites-available/pot-system << 'NGINX'
          server {
              listen 80 default_server;
              server_name _;
              return 301 https://$host$request_uri;
          }
          server {
              listen 443 ssl default_server;
              server_name _;
              ssl_certificate /etc/pot-system/ssl/pot.crt;
              ssl_certificate_key /etc/pot-system/ssl/pot.key;
              ssl_protocols TLSv1.2 TLSv1.3;
              root /opt/pot-system/webui;
              index index.php index.html;
              location / { try_files $uri $uri/ /index.php?$query_string; }
              location ~ \.php$ {
                  fastcgi_pass unix:/run/php/php8.2-fpm.sock;
                  fastcgi_index index.php;
                  include fastcgi_params;
                  fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
              }
          }
          NGINX
          ln -sf /etc/nginx/sites-available/pot-system /etc/nginx/sites-enabled/pot-system
          rm -f /etc/nginx/sites-enabled/default

          # Init SQLite DB
          mkdir -p /var/lib/pot-system
          if [ ! -f /var/lib/pot-system/pot.db ]; then
            sqlite3 /var/lib/pot-system/pot.db "
              CREATE TABLE IF NOT EXISTS users (id INTEGER PRIMARY KEY, username TEXT UNIQUE, password_hash TEXT, role TEXT DEFAULT 'admin');
              CREATE TABLE IF NOT EXISTS license (id INTEGER PRIMARY KEY, type TEXT DEFAULT 'trial', status TEXT DEFAULT 'trial', expires_at DATETIME);
              CREATE TABLE IF NOT EXISTS billing_clients (id INTEGER PRIMARY KEY AUTOINCREMENT, name TEXT, username TEXT, email TEXT, phone TEXT, plan TEXT, amount REAL, due_day INTEGER DEFAULT 1, connection_type TEXT DEFAULT 'pppoe', status TEXT DEFAULT 'active');
              CREATE TABLE IF NOT EXISTS billing_invoices (id INTEGER PRIMARY KEY AUTOINCREMENT, client_id INTEGER, amount REAL, due_date DATE, status TEXT DEFAULT 'pending');
              CREATE TABLE IF NOT EXISTS license_keys (id INTEGER PRIMARY KEY AUTOINCREMENT, key TEXT UNIQUE, device_id TEXT, customer TEXT, type TEXT DEFAULT 'standard', status TEXT DEFAULT 'active', created_at DATETIME DEFAULT CURRENT_TIMESTAMP);
              CREATE TABLE IF NOT EXISTS system_config (key TEXT PRIMARY KEY, value TEXT);
              INSERT OR IGNORE INTO users VALUES (1,'admin','\$2y\$10\$92IXUNpkjO0rOQ5byMi.Ye4oKoEa3Ro9llC/.og/at2.uheWG/igi','admin');
              INSERT OR IGNORE INTO license VALUES (1,'trial','trial',datetime('now','+7 days'));
              INSERT OR IGNORE INTO system_config VALUES ('lan_ip','192.168.10.1');
            "
            chown -R www-data:www-data /var/lib/pot-system
          fi

          # Start services
          systemctl restart php8.2-fpm 2>/dev/null || true
          systemctl restart nginx 2>/dev/null || true
          systemctl restart ssh 2>/dev/null || true

          echo "=== POT System Ready! Web UI: https://192.168.10.1 ==="
          STARTUP
          sudo chmod +x /mnt/root/opt/pot-system/services/startup.sh

      - name: Create systemd service
        run: |
          sudo tee /mnt/root/etc/systemd/system/pot-system.service > /dev/null << 'EOF'
          [Unit]
          Description=POT System Router Service
          After=network.target
          Wants=network.target

          [Service]
          Type=oneshot
          ExecStart=/opt/pot-system/services/startup.sh
          RemainAfterExit=yes

          [Install]
          WantedBy=multi-user.target
          EOF

      - name: Enable services
        run: |
          sudo chroot /mnt/root /bin/bash -c "
            systemctl enable pot-system nginx php8.2-fpm dnsmasq ssh fail2ban chrony frr 2>/dev/null || true
          "

      - name: Setup fstab and GRUB
        run: |
          LOOP=$(cat /tmp/loop_device)
          ROOT_UUID=$(sudo blkid -s UUID -o value ${LOOP}p2)
          EFI_UUID=$(sudo blkid -s UUID -o value ${LOOP}p1)
          printf "UUID=%s  /          ext4  errors=remount-ro  0  1\nUUID=%s  /boot/efi  vfat  umask=0077  0  2\n" "$ROOT_UUID" "$EFI_UUID" | sudo tee /mnt/root/etc/fstab

          # Install GRUB
          sudo chroot /mnt/root /bin/bash -c "
            grub-install --target=x86_64-efi --efi-directory=/boot/efi --removable --recheck 2>&1 | tail -3 || true
            update-grub 2>&1 | tail -3 || true
          "

      - name: Unmount and finalize
        run: |
          LOOP=$(cat /tmp/loop_device)
          sudo umount /mnt/root/dev/pts /mnt/root/dev /mnt/root/sys /mnt/root/proc /mnt/root/boot/efi /mnt/root 2>/dev/null || true
          sudo losetup -d "$LOOP" 2>/dev/null || true

          IMG_NAME="pot-system-1.0-$(date +%Y%m%d)-amd64.img"
          cp /tmp/pot.img "./$IMG_NAME"
          sha256sum "./$IMG_NAME" > "./$IMG_NAME.sha256"
          ls -lh "./$IMG_NAME"
          echo "IMG_NAME=$IMG_NAME" >> $GITHUB_ENV

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pot-system-img
          path: |
            *.img
            *.sha256
          retention-days: 30

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: /tmp/*.log
          retention-days: 7

      - name: Create Release on tag
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            *.img
            *.sha256
          body: |
            ## POT System ${{ github.ref_name }}

            ### Flash with Rufus or balenaEtcher
            1. Download `.img` file
            2. Rufus: Select .img → GPT → UEFI → DD mode → Flash
            3. Install SSD in PC → Boot
            4. Web UI auto-starts: https://192.168.10.1
            5. Login: admin / admin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
